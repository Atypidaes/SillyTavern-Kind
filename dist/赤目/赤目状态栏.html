<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赤目状态栏</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap');
  .akm{ --txt:#eaeaea; --sub:#9fa6b2; --dim:#6b7280; --warm:#ff9d5c; --cold:#7fa8f7; --brd:rgba(255,255,255,.10); --acc:#fff; --acc-glow:rgba(255,255,255,.10); --card-bg:#121212; font-family:'Inter','Noto Sans SC',system-ui,'PingFang SC','Microsoft YaHei',sans-serif; color:var(--txt); -webkit-font-smoothing:antialiased; }
  /* 角色主题色：斋藤圆保持默认黑色 */
  .akm[data-char="赤目"]{ --acc:#f7b7cc; --acc-glow:rgba(247,183,204,.40); --card-bg:#1a1116; }
  .akm[data-char="铃女"]{ --acc:#b39bff; --acc-glow:rgba(179,155,255,.40); --card-bg:#14111e; }
  .akm[data-char="梅里"]{ --acc:#f0d078; --acc-glow:rgba(240,208,120,.40); --card-bg:#1a160e; }
  .akm-card{ display:flex; flex-direction:column; gap:10px; max-width:600px; margin:0 auto; padding:16px; border:1px solid var(--brd); border-radius:12px; background:var(--card-bg); box-shadow:0 8px 20px rgba(0,0,0,.25); }

  /* 主体：左侧立绘，右侧信息 */
  .akm-main{ display:flex; gap:12px; align-items:flex-start; }
  .akm-pic-col{ width:36%; max-width:172px; min-width:104px; display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  /* 翻转卡片：正面 sfw，点击后翻到背面 nsfw */
  .akm-flip{ position:relative; width:100%; aspect-ratio:3/4; border-radius:10px; perspective:800px; }
  .akm-flip-inner{ position:absolute; inset:0; transform-style:preserve-3d; transition:transform .6s ease; }
  .akm-flip.flipped .akm-flip-inner{ transform:rotateY(180deg); }
  .akm-face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:10px; overflow:hidden; border:1px solid var(--brd); background:#0d0d0e; box-shadow:inset 0 0 10px rgba(0,0,0,.45); }
  .akm-face-back{ transform:rotateY(180deg); }
  .akm-pic-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(16px) brightness(.4); transform:scale(1.12); }
  .akm-pic{ position:relative; width:100%; height:100%; object-fit:contain; display:block; }
  /* 左右切换箭头 */
  .akm-arrow{ position:absolute; top:50%; transform:translateY(-50%); width:22px; height:22px; border-radius:50%; border:1px solid rgba(255,255,255,.15); background:rgba(18,18,18,.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); color:#fff; display:grid; place-items:center; cursor:pointer; z-index:3; transition:background .2s, border-color .2s; }
  .akm-arrow:hover{ background:rgba(255,255,255,.16); border-color:var(--acc); }
  .akm-arrow svg{ width:12px; height:12px; }
  .akm-arrow-l{ left:6px; }
  .akm-arrow-r{ right:6px; }
  .akm-pic-cap{ display:flex; align-items:center; gap:5px; padding:0 2px; }
  .akm-pic-cap b{ font-size:14px; font-weight:500; color:var(--acc); text-shadow:0 0 8px var(--acc-glow); white-space:nowrap; }
  .akm-pic-cap i{ font-style:normal; font-size:10px; color:var(--sub); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .akm-flip-hint{ padding:0 2px; font-size:10px; letter-spacing:1px; color:var(--acc); opacity:.75; }

  .akm-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .akm-item{ display:flex; flex-direction:column; gap:6px; padding:10px; border-radius:10px; background:rgba(255,255,255,.04); box-shadow:inset 0 0 10px rgba(0,0,0,.12); }
  .akm-label{ display:flex; align-items:center; gap:.6em; font-size:13px; color:var(--sub); }
  .akm-label svg{ width:13px; height:13px; opacity:.85; flex-shrink:0; }
  .akm-value{ min-width:0; display:flex; flex-direction:column; gap:5px; }
  .akm-v-row{ display:flex; align-items:baseline; gap:8px; font-size:14px; font-weight:500; color:#fff; font-variant-numeric:tabular-nums; }
  .akm-band{ color:var(--sub); font-weight:400; font-size:12px; }
  .akm-num{ margin-left:auto; font-weight:500; }
  .akm-mid{ position:relative; height:8px; border-radius:999px; background:rgba(0,0,0,.35); border:1px solid var(--brd); overflow:visible; }
  .akm-mid-line{ position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:rgba(255,255,255,.28); }
  .akm-dot{ position:absolute; top:50%; transform:translate(-50%,-50%); width:10px; height:10px; border-radius:50%; background:#cfd6df; box-shadow:0 0 8px rgba(255,255,255,.4); transition:left .6s ease, background .6s ease, box-shadow .6s ease; }
  .akm-text{ font-size:12px; line-height:1.7; color:var(--txt); white-space:pre-wrap; word-break:break-word; }
  .akm-text.empty{ color:var(--dim); }
  .akm-warn{ display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,209,102,.35); background:rgba(255,209,102,.08); font-size:12px; line-height:1.6; color:#e8c77a; }

  /* 图库按钮：与角色名/日期同行 */
  .akm-gal-btn{ margin-left:auto; padding:4px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:var(--sub); font-size:11px; font-family:inherit; cursor:pointer; transition:border-color .2s, color .2s, background .2s; white-space:nowrap; flex-shrink:0; }
  .akm-gal-btn:hover{ border-color:var(--acc); color:var(--acc); background:rgba(255,255,255,.1); }

  /* 图库模式 */
  .akm-gallery{ display:flex; flex-direction:column; gap:10px; }
  .akm-gal-head{ display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; gap:8px; }
  .akm-gal-mid{ display:flex; justify-content:center; align-items:baseline; gap:8px; }
  .akm-gal-mid b{ font-size:14px; font-weight:500; color:var(--acc); text-shadow:0 0 8px var(--acc-glow); }
  .akm-gal-mid i{ font-style:normal; font-size:11px; color:var(--sub); }
  .akm-gal-arrow{ width:22px; height:22px; border-radius:50%; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06); color:#fff; display:grid; place-items:center; cursor:pointer; transition:border-color .2s, background .2s; }
  .akm-gal-arrow:hover{ border-color:var(--acc); background:rgba(255,255,255,.12); }
  .akm-gal-arrow svg{ width:12px; height:12px; }
  .akm-gal-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .akm-gal-cell{ display:flex; flex-direction:column; gap:4px; }
  .akm-gal-img{ width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:8px; border:1px solid var(--acc); box-shadow:0 0 6px var(--acc-glow); background:#0d0d0e; }
  .akm-gal-name{ font-size:10px; text-align:center; color:var(--acc); letter-spacing:.5px; }
  .akm-gal-empty{ display:flex; align-items:center; justify-content:center; height:80px; border-radius:8px; border:1px dashed var(--brd); color:var(--dim); font-size:11px; letter-spacing:1px; grid-column:1 / -1; }
  @media (max-width:480px){ .akm-card{ padding:12px; } .akm-main{ flex-direction:column; align-items:stretch; } .akm-pic-col{ width:100%; max-width:200px; margin:0 auto; } }
</style>
</head>

    function pathGet(obj, path, def) {
      var cur = obj, parts = String(path).split('.');
      for (var i = 0; i < parts.length; i++) {
        if (cur === null || cur === undefined) return def;
        cur = cur[parts[i]];
      }
      return (cur === null || cur === undefined) ? def : cur;
    }
    var root = document.currentScript && document.currentScript.previousElementSibling;
    if (!root || !root.classList || !root.classList.contains('akm')) {
      var all = document.querySelectorAll('.akm');
      root = all.length ? all[all.length - 1] : null;
    }
    if (!root) return;
    var el = function(sel){ return root.querySelector('#' + sel); };

    /* 多路径读取 stat_data */

      /* 路径1: MVU 变量框架（消息楼层变量，从最新楼层往前找） */
      try {
        if (window.Mvu && typeof window.Mvu.getMvuData === 'function') {
          for (var i = 1; i <= 3; i++) {
            var v = window.Mvu.getMvuData({ type: 'message', message_id: -i });
            var sd = v && v.stat_data;
            if (sd && typeof sd === 'object') { console.info('[赤目状态栏] 读取来源: Mvu 倒数第' + i + '楼'); return sd; }
          }
        }
      } catch (e) {}
      /* 路径2: 酒馆助手变量接口 */
      var th = window.TavernHelper;
      if (th && typeof th.getVariables === 'function') {
        try {
          var v2 = th.getVariables() || th.getVariables({ type: 'message' });
          if (v2 && v2.stat_data && typeof v2.stat_data === 'object') { console.info('[赤目状态栏] 读取来源: TavernHelper.getVariables'); return v2.stat_data; }
        } catch (e) {}
      }
      if (typeof getAllVariables === 'function') {
        try {
          var v3 = getAllVariables() || {};
          if (v3.stat_data && typeof v3.stat_data === 'object') { console.info('[赤目状态栏] 读取来源: getAllVariables'); return v3.stat_data; }
        } catch (e) {}
      }
      /* 路径3: 酒馆原生 getvar */
      if (typeof window.getvar === 'function') {
        try {
          var v4 = window.getvar('stat_data', { defaults: null });
          if (v4 && typeof v4 === 'object') { console.info('[赤目状态栏] 读取来源: getvar'); return v4; }
        } catch (e) {}
      }
      return null;
    }

        + '</svg>';
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);

    var manualIdx = null;
    var galIdx = 0;

    function renderChar(idx) {
      var name = CHARS[idx];
      var sd = sdCache || {};
      var getVar = function(p, d) { return pathGet(sd, p, d); };

      var time = String(getVar('场景.时间', 'Day1 早'));
      var tmp = parseInt(getVar('数值.' + name + '.临时好感', 0), 10);
      if (!isFinite(tmp)) tmp = 0;
      tmp = Math.max(-100, Math.min(100, tmp));
      var inner = String(getVar('人物.' + name + '.内心想法', ''));
      var outfit = String(getVar('人物.' + name + '.服装', ''));

      /* 主题色（斋藤圆保持默认黑色主题） */
      root.setAttribute('data-char', name);
      el('akm-name').textContent = name;
      el('akm-idx').textContent = (idx + 1) + '/' + CHARS.length;
      el('akm-time').textContent = time;

      /* 立绘：正面随机抽取一对的 sfw，背面为其固定对应的 nsfw */

      var flipEl = el('akm-flip');
      var fronts = root.querySelectorAll('.akm-face-front .akm-pic, .akm-face-front .akm-pic-bg');
      var backs = root.querySelectorAll('.akm-face-back .akm-pic, .akm-face-back .akm-pic-bg');
      var sfw = pair ? (cd.imgs[pair[0]] || '') : '';
      var nsfw = pair ? (cd.imgs[pair[1]] || '') : '';
      flipEl.classList.remove('flipped');
      flipEl.style.cursor = nsfw ? 'pointer' : 'default';
      var hintEl = el('akm-flip-hint');
      if (hintEl) hintEl.style.display = nsfw ? 'block' : 'none';
      fronts.forEach(function(im) {
        im.src = sfw || ph;
        im.onerror = function() { im.onerror = null; im.src = ph; };
      });
      backs.forEach(function(im) {
        im.src = nsfw || ph;
        im.onerror = function() { im.onerror = null; im.src = ph; };
      });
      flipEl._nsfw = !!nsfw;

      /* 临时好感：-100~100 十档 */
      var BANDS = { 1:'暴怒', 2:'冷处理', 3:'厌恶', 4:'阻止', 5:'轻微不悦', 6:'轻微认可', 7:'窃喜', 8:'想要更多', 9:'心动害羞', 10:'一生一次的感动' };
      var band = tmp <= -80 ? 1 : tmp <= -60 ? 2 : tmp <= -40 ? 3 : tmp <= -20 ? 4 : tmp < 0 ? 5 : tmp <= 20 ? 6 : tmp <= 40 ? 7 : tmp <= 60 ? 8 : tmp <= 80 ? 9 : 10;
      var bandEl = el('akm-tmp-band');
      var numEl = el('akm-tmp-num');
      var dotEl = el('akm-tmp-dot');
      bandEl.textContent = BANDS[band];
      numEl.textContent = (tmp > 0 ? '+' : '') + tmp;
      var pct = (tmp + 100) / 2;
      dotEl.style.left = pct + '%';
      var col = tmp < 0 ? '#7fa8f7' : '#ff9d5c';
      dotEl.style.background = col;
      dotEl.style.boxShadow = '0 0 8px ' + col;
      bandEl.style.color = tmp < 0 ? '#8fb0f8' : '#f5a068';
      numEl.style.color = col;

      /* 心声与服装 */
      var innerEl = el('akm-inner');
      innerEl.textContent = inner || '——';
      innerEl.classList.toggle('empty', !inner);
      var outfitEl = el('akm-outfit');
      outfitEl.textContent = outfit || '——';
      outfitEl.classList.toggle('empty', !outfit);
    }

    /* 自动跟随当前互动角色（重新渲染时回到自动模式） */
    function renderAll(sd) {
      sdCache = sd;
      var name = String(pathGet(sd, '场景.当前互动角色', '') || '').trim() || '赤目';
      autoIdx = CHARS.indexOf(name);
      if (autoIdx === -1) autoIdx = 0;
      manualIdx = null;
      renderChar(autoIdx);
    }

    /* 左右箭头：手动切换浏览 */
    var btnL = root.querySelector('.akm-arrow-l'), btnR = root.querySelector('.akm-arrow-r');
    function step(n) {
      var base = manualIdx === null ? autoIdx : manualIdx;
      manualIdx = (base + n + CHARS.length) % CHARS.length;
      renderChar(manualIdx);
    }
    if (btnL) btnL.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); step(-1); });
    if (btnR) btnR.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); step(1); });

    /* 点击翻转 sfw/nsfw（仅有 nsfw 图的角色生效） */
    var flipClickEl = el('akm-flip');
    if (flipClickEl) {
      flipClickEl.addEventListener('click', function() {
        if (flipClickEl._nsfw) flipClickEl.classList.toggle('flipped');
      });
    }

    /* ------- 图库模式 ------- */
    function renderGallery(idx) {
      var name = CHARS[idx];
      root.setAttribute('data-char', name);
      el('akm-gal-name').textContent = name;
      el('akm-gal-idx').textContent = (idx + 1) + '/' + CHARS.length;
      var grid = el('akm-gal-grid');
      grid.innerHTML = '';
      var cd = CG[name] || { imgs: {} };
      var ph = placeholderFor(name);
      var keys = Object.keys(cd.imgs);
      if (!keys.length) {
        var emptyCell = document.createElement('div');
        emptyCell.className = 'akm-gal-cell';
        emptyCell.innerHTML = '<div class="akm-gal-empty">暂无CG</div>';
        grid.appendChild(emptyCell);
        return;
      }
      keys.forEach(function(nm) {
        var cell = document.createElement('div');
        cell.className = 'akm-gal-cell';
        var img = document.createElement('img');
        img.className = 'akm-gal-img';
        img.alt = nm;
        img.loading = 'lazy';
        img.src = cd.imgs[nm];
        img.onerror = function() { img.onerror = null; img.src = ph; };
        var cap = document.createElement('span');
        cap.className = 'akm-gal-name';
        cap.textContent = nm;
        cell.appendChild(img);
        cell.appendChild(cap);
        grid.appendChild(cell);
      });
    }

    var galleryOpen = false;
    var galBtn = el('akm-gal-btn'), galBtn2 = el('akm-gal-btn2');
    function setGalBtns(text) {
      if (galBtn) galBtn.textContent = text;
      if (galBtn2) galBtn2.textContent = text;
    }
    function toggleGallery() {
      galleryOpen = !galleryOpen;
      el('akm-main').style.display = galleryOpen ? 'none' : 'flex';
      el('akm-gallery').style.display = galleryOpen ? 'flex' : 'none';
      setGalBtns(galleryOpen ? '返回状态栏' : '图库');
      if (galleryOpen) {
        galIdx = manualIdx === null ? autoIdx : manualIdx;
        renderGallery(galIdx);
      }
    }
    if (galBtn) galBtn.addEventListener('click', toggleGallery);
    if (galBtn2) galBtn2.addEventListener('click', toggleGallery);
    var galL = el('akm-gal-l'), galR = el('akm-gal-r');
    function galStep(n) {
      galIdx = (galIdx + n + CHARS.length) % CHARS.length;
      renderGallery(galIdx);
    }
    if (galL) galL.addEventListener('click', function(){ galStep(-1); });
    if (galR) galR.addEventListener('click', function(){ galStep(1); });

    var sd = readStat();
    if (sd) {
      renderAll(sd);
    } else {
      el('akm-warn').style.display = 'flex';
      console.warn('[赤目状态栏] 未能读取到 stat_data：Mvu/TavernHelper/getvar 均不可用或无数据');
      /* 消息可能尚未渲染完变量，延迟重试一次 */
      setTimeout(function() {
        var sd2 = readStat();
        if (sd2) { el('akm-warn').style.display = 'none'; renderAll(sd2); }
      }, 500);
    }
  } catch (e) { /* 酒馆环境缺失时静默 */ }
})();
</script>
</body>
</html>
