<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日和状态栏</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap');
  .hrb{ --txt:#eaeaea; --sub:#9fa6b2; --dim:#6b7280; --fav:#ff9d5c; --ero:#ff6b81; --gold:#ffd166; --brd:rgba(255,255,255,.10); font-family:'Inter','Noto Sans SC',system-ui,'PingFang SC','Microsoft YaHei',sans-serif; color:var(--txt); -webkit-font-smoothing:antialiased; }
  .hrb-card{ display:flex; flex-direction:column; gap:10px; max-width:600px; margin:0 auto; padding:16px; border:1px solid var(--brd); border-radius:12px; background:#121212; box-shadow:0 8px 20px rgba(0,0,0,.25); }
  .hrb-head{ display:flex; align-items:center; gap:.6em; padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid var(--brd); }
  .hrb-head-ico{ width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.06); box-shadow:inset 0 0 6px rgba(0,0,0,.35); }
  .hrb-head-ico svg{ width:15px; height:15px; }
  .hrb-title{ font-size:20px; font-weight:500; color:#fff; text-shadow:0 0 10px rgba(255,255,255,.10); letter-spacing:.01em; }
  .hrb-head-sub{ margin-left:auto; font-size:12px; color:var(--dim); letter-spacing:2px; }
  .hrb-hero{ position:relative; height:280px; border-radius:12px; overflow:hidden; border:1px solid var(--brd); background:#0d0d0e; box-shadow:inset 0 0 10px rgba(0,0,0,.45); }
  .hrb-pic-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(16px) brightness(.4); transform:scale(1.12); }
  .hrb-pic{ position:relative; width:100%; height:100%; object-fit:contain; display:block; }
  .hrb-pic-tag{ position:absolute; left:0; right:0; bottom:0; padding:26px 14px 8px; font-size:12px; letter-spacing:2px; color:#eaeaea; background:linear-gradient(180deg,transparent,rgba(0,0,0,.78)); display:flex; align-items:baseline; gap:8px; }
  .hrb-pic-tag b{ font-size:15px; font-weight:500; }
  .hrb-pic-tag i{ margin-left:auto; font-style:normal; font-size:11px; color:var(--sub); font-variant-numeric:tabular-nums; }
  .hrb-arrow{ position:absolute; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; border:1px solid rgba(255,255,255,.15); background:rgba(18,18,18,.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); color:#fff; display:grid; place-items:center; cursor:pointer; transition:background .2s, border-color .2s; z-index:2; }
  .hrb-arrow:hover{ background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.3); }
  .hrb-arrow svg{ width:14px; height:14px; }
  .hrb-arrow-l{ left:10px; }
  .hrb-arrow-r{ right:10px; }
  .hrb-item{ display:grid; grid-template-columns:30% 1fr; column-gap:12px; align-items:center; padding:10px; border-radius:10px; background:rgba(255,255,255,.04); box-shadow:inset 0 0 10px rgba(0,0,0,.12); }
  .hrb-label{ display:flex; align-items:center; gap:.6em; font-size:13px; color:var(--sub); }
  .hrb-label svg{ width:13px; height:13px; opacity:.85; flex-shrink:0; }
  .hrb-dot{ width:5px; height:5px; border-radius:50%; background:var(--c,#fff); box-shadow:0 0 5px var(--c,#fff); flex-shrink:0; }
  .hrb-value{ min-width:0; display:flex; flex-direction:column; gap:5px; }
  .hrb-v-row{ display:flex; align-items:baseline; gap:8px; font-size:14px; font-weight:500; color:#fff; font-variant-numeric:tabular-nums; }
  .hrb-v-row svg{ width:13px; height:13px; flex-shrink:0; }
  .hrb-stage{ color:var(--sub); font-weight:400; font-size:12px; }
  .hrb-stage.max{ color:var(--gold); text-shadow:0 0 8px rgba(255,209,102,.5); }
  .hrb-delta{ margin-left:auto; font-size:12px; font-style:normal; font-variant-numeric:tabular-nums; }
  .hrb-track-fav .hrb-delta.up{ color:var(--fav); }
  .hrb-track-ero .hrb-delta.up{ color:var(--ero); }
  .hrb-delta.down{ color:#7fa8f7; }
  .hrb-delta.flat{ color:var(--dim); }
  .hrb-bar{ height:8px; border-radius:999px; background:rgba(0,0,0,.35); border:1px solid var(--brd); overflow:hidden; }
  .hrb-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg,#fff,#cfd6df); box-shadow:0 0 8px rgba(255,255,255,.18); transition:width .6s ease; }
  .hrb-hr{ border:none; height:1px; margin:2px 0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent); }
  .hrb-cells{ display:flex; gap:3px; }
  .hrb-bus-cell{ flex:1; height:6px; border-radius:999px; background:rgba(255,255,255,.10); transition:background .4s; }
  .hrb-bus-cell.on{ background:#cfd6df; box-shadow:0 0 6px rgba(255,255,255,.35); }
  .hrb-ico-sun,.hrb-ico-moon{ display:none; }
  @media (max-width:480px){ .hrb-card{ padding:12px; } .hrb-title{ font-size:17px; } .hrb-hero{ height:220px; } .hrb-item{ grid-template-columns:28% 1fr; column-gap:8px; padding:8px; } }
</style>
</head>
<body>
<div class="hrb">
  <div class="hrb-card">
    <div class="hrb-head">
      <span class="hrb-head-ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v11a1 1 0 0 1-1 1h-1M4 6v9a1 1 0 0 0 1 1h1M7 18v1M17 18v1M8 18h8M7 8h10"/><circle cx="7.5" cy="14.5" r=".8"/><circle cx="16.5" cy="14.5" r=".8"/></svg></span>
      <span class="hrb-title">状态栏</span>
      <span class="hrb-head-sub">状态栏</span>
    </div>

    <div class="hrb-hero">
      <!-- 立绘：src 由脚本按当前角色填入；加载失败时自动显示占位图 -->
      <img class="hrb-pic-bg" alt="" src="">
      <img class="hrb-pic" alt="" src="">
      <button class="hrb-arrow hrb-arrow-l" type="button" aria-label="上一个角色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="hrb-arrow hrb-arrow-r" type="button" aria-label="下一个角色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <div class="hrb-pic-tag"><b id="hrb-char-name">菱川日和</b><i id="hrb-char-idx">1/3</i></div>
    </div>

    <div class="hrb-item">
      <div class="hrb-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>场景</div>
      <div class="hrb-value"><div class="hrb-v-row"><span id="hrb-scene">——</span></div></div>
    </div>
    <div class="hrb-item">
      <div class="hrb-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>时间</div>
      <div class="hrb-value"><div class="hrb-v-row"><svg class="hrb-ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="hrb-ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span id="hrb-time">——</span></div></div>
    </div>
    <div class="hrb-item hrb-track-fav">
      <div class="hrb-label"><i class="hrb-dot" style="--c:var(--fav)"></i>好感度</div>
      <div class="hrb-value">
        <div class="hrb-v-row"><span class="hrb-stage" id="hrb-fav-stage">阶段一</span><span id="hrb-fav-num">0/20</span><i class="hrb-delta flat" id="hrb-fav-delta">±0</i></div>
        <div class="hrb-bar"><div class="hrb-fill" id="hrb-fav-fill" style="width:0%"></div></div>
      </div>
    </div>
    <div class="hrb-item hrb-track-ero">
      <div class="hrb-label"><i class="hrb-dot" style="--c:var(--ero)"></i>色情度</div>
      <div class="hrb-value">
        <div class="hrb-v-row"><span class="hrb-stage" id="hrb-ero-stage">阶段一</span><span id="hrb-ero-num">0/20</span><i class="hrb-delta flat" id="hrb-ero-delta">±0</i></div>
        <div class="hrb-bar"><div class="hrb-fill" id="hrb-ero-fill" style="width:0%"></div></div>
      </div>
    </div>
    <hr class="hrb-hr">
    <div class="hrb-item">
      <div class="hrb-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v11a1 1 0 0 1-1 1h-1M4 6v9a1 1 0 0 0 1 1h1M7 18v1M17 18v1M8 18h8M7 8h10"/><circle cx="7.5" cy="14.5" r=".8"/><circle cx="16.5" cy="14.5" r=".8"/></svg>公交车</div>
      <div class="hrb-value">
        <div class="hrb-v-row"><span id="hrb-bus-txt">距离到站 ——</span></div>
        <div class="hrb-cells" id="hrb-bus-cells"></div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  try {
    function pathGet(obj, path, def) {
      var cur = obj, parts = String(path).split('.');
      for (var i = 0; i < parts.length; i++) {
        if (cur === null || cur === undefined) return def;
        cur = cur[parts[i]];
      }
      return (cur === null || cur === undefined) ? def : cur;
    }
    var root = document.currentScript && document.currentScript.previousElementSibling;
    if (!root || !root.classList || !root.classList.contains('hrb')) {
      var all = document.querySelectorAll('.hrb');
      root = all.length ? all[all.length - 1] : null;
    }
    if (!root) return;
    var el = function(sel){ return root.querySelector('#' + sel); };

    var gv = (typeof getAllVariables === 'function') ? getAllVariables
      : ((window.TavernHelper && typeof window.TavernHelper.getAllVariables === 'function') ? window.TavernHelper.getAllVariables : null);
    var vars = gv ? (gv() || {}) : {};
    var getVar = function(p, d){ return pathGet(vars, 'stat_data.' + p, d); };

    /* 局面 */
    var scene = getVar('局面.场景', '');
    var time = getVar('局面.时间', '');
    var remain = parseInt(getVar('局面.互动次数.距离公交车到达', 0), 10) || 0;
    if (scene) el('hrb-scene').textContent = scene;
    if (time) el('hrb-time').textContent = time;
    var sunIco = root.querySelector('.hrb-ico-sun'), moonIco = root.querySelector('.hrb-ico-moon');
    if (sunIco && moonIco) {
      var isNight = (time === '晚');
      sunIco.style.display = isNight ? 'none' : 'inline-block';
      moonIco.style.display = isNight ? 'inline-block' : 'none';
    }

    /* 公交车倒计时 */
    var cellsEl = el('hrb-bus-cells');
    cellsEl.innerHTML = '';
    var lit = Math.max(0, Math.min(8, remain));
    for (var i = 0; i < 8; i++) {
      var c = document.createElement('div');
      c.className = 'hrb-bus-cell' + (i < lit ? ' on' : '');
      cellsEl.appendChild(c);
    }
    el('hrb-bus-txt').textContent = remain > 0 ? ('距离到站 ' + remain + ' 次互动') : '公交车到站了';

    /* 三位角色 */
    var STAGE_IMG = { '一':'https://files.catbox.moe/j6wir3.png', '二':'https://files.catbox.moe/j6wir3.png', '三':'https://files.catbox.moe/0nx1mb.png', '四':'https://files.catbox.moe/0nx1mb.png', '五':'https://files.catbox.moe/jhuy86.png', '六':'https://files.catbox.moe/jhuy86.png', 'MAX':'https://files.catbox.moe/jhuy86.png' };
    var CHARS = [
      { name: '菱川日和', logKeys: ['菱川日和', '日和'], main: true },
      { name: '菱川夫人', logKeys: ['菱川夫人', '夫人', '妈妈'], imgs: ['https://files.catbox.moe/kp97uo.png','https://files.catbox.moe/hnsk1d.png','https://files.catbox.moe/ojiw23.png','https://files.catbox.moe/rpgvjy.png','https://files.catbox.moe/a0559d.png'] },
      { name: '宫田老师', logKeys: ['宫田老师', '宫田', '老师'], imgs: ['https://files.catbox.moe/pqb7il.png','https://files.catbox.moe/vo3d8u.png','https://files.catbox.moe/f3s1my.png'] }
    ];

    function imgFor(cd) {
      if (cd.main) {
        var stage = String(getVar('两条轨.好感.阶段', '一'));
        return STAGE_IMG[stage] || STAGE_IMG['一'];
      }
      var list = cd.imgs || [];
      return list.length ? list[Math.floor(Math.random() * list.length)] : '';
    }

    function logFor(cd) {
      var entry = null;
      for (var i = 0; i < cd.logKeys.length && !entry; i++) entry = getVar('日志.' + cd.logKeys[i], null);
      if (!entry || typeof entry !== 'object') return null;
      var parse = function(k) {
        var s = String(entry[k] || '');
        var parts = s.split('.');
        var val = parseInt(parts[1], 10);
        return { stage: parts[0] || '一', val: isNaN(val) ? 0 : Math.min(20, Math.max(0, val)) };
      };
      return { fav: parse('好感'), ero: parse('色情') };
    }

    /* 两条轨显示（日和用变量，其余角色用日志） */
    function renderTracks(cIdx) {
      var cd = CHARS[cIdx];
      var fav, ero, showDelta = (cIdx === 0);
      if (cIdx === 0) {
        fav = { stage: String(getVar('两条轨.好感.阶段', '一')), val: Math.min(20, Math.max(0, parseInt(getVar('两条轨.好感.数值', 0), 10) || 0)), delta: parseInt(getVar('两条轨.好感.本回合变化', 0), 10) || 0 };
        ero = { stage: String(getVar('两条轨.色情度.阶段', '一')), val: Math.min(20, Math.max(0, parseInt(getVar('两条轨.色情度.数值', 0), 10) || 0)), delta: parseInt(getVar('两条轨.色情度.本回合变化', 0), 10) || 0 };
      } else {
        var lg = logFor(cd) || { fav: { stage: '一', val: 0 }, ero: { stage: '一', val: 0 } };
        fav = { stage: lg.fav.stage, val: lg.fav.val, delta: 0 };
        ero = { stage: lg.ero.stage, val: lg.ero.val, delta: 0 };
      }
      function put(prefix, t) {
        el(prefix + '-num').textContent = t.val + '/20';
        el(prefix + '-fill').style.width = (t.val / 20 * 100) + '%';
        var dEl = el(prefix + '-delta');
        if (!showDelta) { dEl.textContent = ''; dEl.className = 'hrb-delta flat'; }
        else if (t.delta > 0) { dEl.textContent = '+' + t.delta; dEl.className = 'hrb-delta up'; }
        else if (t.delta < 0) { dEl.textContent = String(t.delta); dEl.className = 'hrb-delta down'; }
        else { dEl.textContent = '±0'; dEl.className = 'hrb-delta flat'; }
        var stageEl = el(prefix + '-stage');
        stageEl.textContent = '阶段' + t.stage;
        if (t.stage === 'MAX') stageEl.classList.add('max'); else stageEl.classList.remove('max');
      }
      put('hrb-fav', fav);
      put('hrb-ero', ero);
    }

    /* 立绘区与切换 */
    var img = root.querySelector('.hrb-pic');
    var imgBg = root.querySelector('.hrb-pic-bg');
    var nameEl = el('hrb-char-name');
    var idxEl = el('hrb-char-idx');
    var curIdx = 0;
    try {
      var saved = parseInt(localStorage.getItem('hrb-char-idx'), 10);
      if (!isNaN(saved) && saved >= 0 && saved < CHARS.length) curIdx = saved;
    } catch (e) {}

    function placeholderFor(name) {
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320">'
        + '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1d24"/><stop offset="1" stop-color="#0d0d0e"/></linearGradient></defs>'
        + '<rect width="240" height="320" fill="url(#g)"/>'
        + '<circle cx="120" cy="116" r="46" fill="#3f4350"/>'
        + '<path d="M50 306 q10-74 70-74 q60 0 70 74 z" fill="#3f4350"/>'
        + '<text x="120" y="278" text-anchor="middle" fill="#8b90a5" font-size="14" font-family="sans-serif" letter-spacing="3">立绘占位</text>'
        + '</svg>';
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function renderChar() {
      var cd = CHARS[curIdx];
      nameEl.textContent = cd.name;
      idxEl.textContent = (curIdx + 1) + '/' + CHARS.length;
      var src = imgFor(cd);
      var ph = placeholderFor(cd.name);
      img.src = src || ph;
      if (imgBg) imgBg.src = src || ph;
      img.onerror = function() {
        img.onerror = null;
        img.src = ph;
        if (imgBg) imgBg.src = ph;
      };
      renderTracks(curIdx);
    }
    renderChar();

    var btnL = root.querySelector('.hrb-arrow-l'), btnR = root.querySelector('.hrb-arrow-r');
    function step(n) {
      curIdx = (curIdx + n + CHARS.length) % CHARS.length;
      try { localStorage.setItem('hrb-char-idx', String(curIdx)); } catch (e) {}
      renderChar();
    }
    if (btnL) btnL.addEventListener('click', function(e){ e.preventDefault(); step(-1); });
    if (btnR) btnR.addEventListener('click', function(e){ e.preventDefault(); step(1); });
  } catch (e) { /* 酒馆环境缺失时静默 */ }
})();
</script>
</body>
</html>
